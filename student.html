<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>학교 시간표</title>
    <style>
        /* html과 body가 스마트폰 화면 크기를 절대 벗어나지 못하도록 고정 */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff;
            -webkit-text-size-adjust: none; /* 아이폰 글자 크기 강제 확대 방지 */
        }
        
        /* 배너 50px을 정확히 위로 밀고, 비율이 깨지지 않게 화면 안에 가두는 설정 */
        iframe { 
            width: 100%; 
            height: calc(100% + 50px); 
            border: none; 
            position: absolute; 
            top: 0px; 
            left: 0;
            /* 아래 속성들이 모바일 브라우저 안에서 완벽한 1:1 비율을 유지하게 만듭니다 */
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch; 
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxrGT89cTplr2IUKqv7FoolKEWf5NcGcaarEHeqPmQb4mQ4xuLIqvtz0-XFDaOeKuXPlQ/exec"></iframe>
</body>
</html>
