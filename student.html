<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 시간표</title>
    <style>
        /* 화면에 여백을 없애고 꽉 채우는 설정 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f5f5f5; }
        
        /* 상단 배너 50px만 완벽하게 밀어 올리고 화면 비율은 1:1을 유지하는 마법의 코드 */
        iframe { 
            width: 100%; 
            height: calc(100% + 50px); 
            border: none; 
            position: absolute; 
            top: -50px; 
            left: 0;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxrGT89cTplr2IUKqv7FoolKEWf5NcGcaarEHeqPmQb4mQ4xuLIqvtz0-XFDaOeKuXPlQ/exec"></iframe>
</body>
</html>
