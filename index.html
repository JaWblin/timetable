<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면에 완벽하게 꽉 차도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학교 시간표</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        /* 상단 배너 높이(50px)만큼 iframe을 위로 밀어 올리고, 아래를 그만큼 더 늘리는 마법의 코드 */
        iframe { width: 100%; height: calc(100% + 50px); border: none; position: absolute; top: -50px; left: 0; }
    </style>
</head>
<body>
    <!-- 아래 큰따옴표 안에 선생님의 원래 앱스크립트 주소(exec로 끝나는 것)를 넣으세요 -->
    <iframe src="https://script.google.com/macros/s/AKfycbxrGT89cTplr2IUKqv7FoolKEWf5NcGcaarEHeqPmQb4mQ4xuLIqvtz0-XFDaOeKuXPlQ/exec"></iframe>
</body>
</html>
